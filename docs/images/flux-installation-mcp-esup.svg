<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Flux d'installation et d'authentification MCP</title>
  <desc id="desc">Le catalogue GitHub génère la configuration, puis l'utilisateur passe par OIDC avant un appel MCP contrôlé.</desc>
  <defs>
    <style>
      .box { stroke: #17324d; stroke-width: 2; rx: 14; }
      .label { font: 600 19px sans-serif; fill: #17324d; text-anchor: middle; }
      .small { font: 15px sans-serif; fill: #35536d; text-anchor: middle; }
      .arrow { stroke: #42708f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#42708f"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#eef4f1"/>
  <text x="55" y="55" font="700 29px sans-serif" fill="#17324d">Installation d'un connecteur</text>
  <rect class="box" x="55" y="125" width="190" height="105" fill="#f1c27d"/><text class="label" x="150" y="168">Administrateur</text><text class="small" x="150" y="198">clone + configure</text>
  <rect class="box" x="310" y="125" width="190" height="105" fill="#b8cbe0"/><text class="label" x="405" y="168">Catalogue GitHub</text><text class="small" x="405" y="198">manifest + docs</text>
  <rect class="box" x="565" y="125" width="190" height="105" fill="#a9d6c2"/><text class="label" x="660" y="168">Docker Compose</text><text class="small" x="660" y="198">service + secrets</text>
  <rect class="box" x="820" y="125" width="190" height="105" fill="#d6c5e9"/><text class="label" x="915" y="168">MCP actif</text><text class="small" x="915" y="198">healthcheck</text>
  <path class="arrow" d="M245 178 H310"/><path class="arrow" d="M500 178 H565"/><path class="arrow" d="M755 178 H820"/>
  <line x1="660" y1="230" x2="660" y2="335" stroke="#42708f" stroke-width="3" stroke-dasharray="8 8"/>
  <rect class="box" x="55" y="350" width="190" height="105" fill="#f1c27d"/><text class="label" x="150" y="393">Utilisateur</text><text class="small" x="150" y="423">question métier</text>
  <rect class="box" x="310" y="350" width="190" height="105" fill="#e6a6a6"/><text class="label" x="405" y="393">OIDC / CAS</text><text class="small" x="405" y="423">JWT court</text>
  <rect class="box" x="565" y="350" width="190" height="105" fill="#a9d6c2"/><text class="label" x="660" y="393">Bridge MCP</text><text class="small" x="660" y="423">ACL + confirmation</text>
  <rect class="box" x="820" y="350" width="190" height="105" fill="#c3d9a6"/><text class="label" x="915" y="393">API métier</text><text class="small" x="915" y="423">LimeSurvey / autre</text>
  <path class="arrow" d="M245 403 H310"/><path class="arrow" d="M500 403 H565"/><path class="arrow" d="M755 403 H820"/>
  <rect x="1030" y="350" width="115" height="105" rx="14" fill="#17324d"/><text x="1087" y="389" font="600 17px sans-serif" fill="#fff" text-anchor="middle">Audit</text><text x="1087" y="417" font="15px sans-serif" fill="#fff" text-anchor="middle">sans secret</text>
  <path class="arrow" d="M1010 403 H1030"/>
</svg>