id: legifrance
display_name: Légifrance MCP (OpenLegi)
status: poc
source:
  repository: à confirmer lors de l'implémentation
  documentation: https://www.openlegi.fr/
connection:
  transport: streamable-http
  # Le jeton personnel se transmet directement dans l'URL (paramètre
  # ?token=), pas via un en-tête d'authentification. Remplacer
  # {OPENLEGI_TOKEN} par la valeur réelle, jamais versionnée.
  url: https://mcp.openlegi.fr/legifrance/mcp?token={OPENLEGI_TOKEN}
  authentication: none
configuration:
  required:
    - OPENLEGI_TOKEN
  notes: >-
    Créer un compte gratuit sur openlegi.fr, puis récupérer le jeton MCP
    depuis le tableau de bord. Ce même jeton donne accès à d'autres
    services MCP du même tableau de bord (RNE, BOFiP, BODACC, et bientôt
    EUR-Lex et Judilibre), non catalogués ici — voir
    docs/connectors/legifrance.md.
capabilities:
  access: read-only
  domains: [codes, lois, decrets, jurisprudence, jorf]
security:
  confirmation_required: false
  external_results_are_untrusted: true
