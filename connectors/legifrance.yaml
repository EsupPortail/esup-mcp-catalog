id: legifrance
display_name: Légifrance MCP (OpenLegi)
status: poc
source:
  repository: à confirmer lors de l'implémentation
  documentation: à confirmer lors de l'implémentation
connection:
  transport: streamable-http
  url: https://mcp.openlegi.fr/legifrance/mcp
  # Non confirmé. L'API officielle Légifrance (PISTE/DILA) exige
  # normalement des identifiants OAuth ; si ce proxy MCP les porte
